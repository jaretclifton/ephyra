name: Pages

# Publishes the Ephyra site to GitHub Pages at https://midasvo.nl/ephyra/ (the custom domain of
# midasvo.github.io). Needs Settings → Pages → Source set to "GitHub Actions".
#
# - site/ (the landing page and the privacy policy that Google Play links to) is published as it
#   is, at the root, with the screenshots of images/screenshots/ beside it.
# - devsite/ (Astro Starlight) is the documentation: guide/ (using Ephyra, with its feature lists
#   from docs/features.yaml) and dev/ (#928: the repository's Markdown and the LikeC4 model in
#   docs/architecture/model/). `npm run pages` composes it all the same way locally.
#
# It also checks that the README's radar (images/readme/) is what docs/features.yaml gives.
#
# A pull request that touches either builds them, so a broken page or model fails before the merge;
# only a push to main deploys.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &pages-paths
      - "site/**"
      - "devsite/**"
      - "docs/**"
      - "images/screenshots/**"
      - "images/readme/**"
      - "CLAUDE.md"
      - ".github/workflows/pages.yml"
  pull_request:
    branches:
      - main
    paths: *pages-paths

permissions:
  contents: read

# A pull request's runs replace each other. Every publishing run (a push to main or a manual run)
# shares one group and waits its turn, so the site is deployed in the order the runs started.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build sites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: devsite/package-lock.json

      - name: Install the development site's tools
        working-directory: devsite
        run: npm ci

      - name: Validate the architecture model
        working-directory: devsite
        run: npm run check-model

      - name: Check that the README's radar matches docs/features.yaml
        working-directory: devsite
        run: npm run readme-assets -- --check

      - name: Build the documentation site
        working-directory: devsite
        run: npm run build

      - name: Put the sites together
        working-directory: devsite
        run: node scripts/compose.mjs "$RUNNER_TEMP/pages"

      # Every file of site/ is in the result as it is: nothing the build wrote replaced one.
      - name: Check that site/ is published unchanged
        run: |
          cd site
          find . -type f -print0 | while IFS= read -r -d '' f; do
            cmp "$f" "$RUNNER_TEMP/pages/$f"
          done

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    name: Deploy site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
