name: Pages

# Publishes the Ephyra site and the development site to GitHub Pages at https://midasvo.nl/ephyra/
# (the custom domain of midasvo.github.io). Needs Settings → Pages → Source set to "GitHub Actions".
#
# - site/ (the landing page and the privacy policy that Google Play links to) is published as it
#   is, at the root.
# - devsite/ (Astro Starlight, #928) is built from the repository's Markdown and the LikeC4 model in
#   docs/architecture/model/, and published at dev/. `npm run pages` composes both the same way
#   locally.
#
# A pull request that touches either builds them, so a broken page or model fails before the merge;
# only a push to main deploys.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &pages-paths
      - "site/**"
      - "devsite/**"
      - "docs/**"
      - "CLAUDE.md"
      - ".github/workflows/pages.yml"
  pull_request:
    branches:
      - main
    paths: *pages-paths

permissions:
  contents: read

# A pull request's runs replace each other. Every publishing run (a push to main or a manual run)
# shares one group and waits its turn, so the site is deployed in the order the runs started.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build sites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: devsite/package-lock.json

      - name: Install the development site's tools
        working-directory: devsite
        run: npm ci

      - name: Validate the architecture model
        working-directory: devsite
        run: npm run check-model

      - name: Build the development site
        working-directory: devsite
        run: npm run build

      - name: Put both sites together
        working-directory: devsite
        run: node scripts/compose.mjs "$RUNNER_TEMP/pages"

      - name: Check that site/ is published unchanged
        run: diff -r site "$RUNNER_TEMP/pages" --exclude=dev

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    name: Deploy site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
