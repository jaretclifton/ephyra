      - app/phone/src/main/java/dev/jdtech/jellyfin/presentation/film/components/DownloadQualityDialog.kt
    ports: [DownloadStore, DownloadSettings, CurrentServerId, MediaRepository, DownloadTexts]
    docs: [docs/areas/downloads.md, docs/dev-environment.md, docs/architecture/5-hexagonal-ddd.md, docs/open-decisions.md]
    checklist:
      - "./gradlew :downloads:testDebugUnitTest :data:testDebugUnitTest :modes:film:testDebugUnitTest"
      - "Download, cut the server off with iptables, bring it back, check the queue"
    test_data:
      - "users: tester (may download), nodownload (may not)"
      - "Plain Movie, Short Movie, Versions Movie, Tracks Movie (external .de.srt)"
      - "Image Subs Movie and Tracks Show at 1.5 Mbps (transcoded download)"
      - "Test Show, Long Season Show, Resume Show (seasons, smart downloads)"
      - "forward.py 8097 8096 600 for a slow transfer"
    rules: [R13, R15, R9, R4, R10, R1, R2]
    tests:
      - "downloads: DownloadQueue*Test, MediaDownloadEngine*Test, ResumeValidatorsTest, SmartDownloadPlannerTest, OrphanSweep*Test"
      - "domain: DownloadStateTest"
      - "data: StoredFallbackTest, StoredItemFallbackTest, UnfinishedDownloadPlaybackTest"
      - "modes/film: DownloadsViewModelUserSwitchTest, QueueCountsTest"
      - "app/phone (testLibreDebugUnitTest): DownloadQualityDialogTest, DownloadStatusTextTest"
    pitfalls:
      - "#912: a download cut off by an unreachable server stays failed after 3 retries"
      - "#718: one item id is stored for one server; a second server's download replaces it"
      - "Re-download keeps old metadata (IGNORE inserts, open-decisions data-02)"
      - "The engine is in-process: the pump service keeps it alive, restoreAll resumes"
      - "#921: DownloadsViewModelUserSwitchTest is flaky on CI"
    decisions: ["#38", "#116", "#281", "#560", "#850", "#897", "#899", "#901", "#918", "ADR 0002"]

