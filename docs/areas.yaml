# The areas of Ephyra: where to work on what (#928).
#
# One entry per area. The `start-work` skill (.claude/skills/start-work) and the development site
# (devsite/) read this file. Paths are relative to the repository root and were checked against
# `main` when the entry was written; the code is right where they differ.
#
# Fields:
#   id         the area's name, also the guide's file name (docs/areas/<id>.md)
#   title      shown on the site
#   guide      the guide, when there is one
#   status     `guide` (a guide in docs/areas/ and every field filled) or `row` (paths and a summary
#              only, no guide yet)
#   summary    one sentence: what the area is
#   keywords   words someone uses for it, English and Dutch, for the skill to match a request
#   paths      the code, most important first
#   ports      the ports and stores it goes through (domain/ports, application)
#   docs       the docs to read, most important first
#   checklist  what to run by hand before a PR, if anything
#   test_data  what on the test server (docs/dev-environment.md) exercises it
#   rules      the Konsist rules (architecture/) that guard it
#   tests      the unit tests that cover it: run these first
#   pitfalls   what went wrong before
#   decisions  the ADRs and issues that shaped it

areas:
  - id: subtitles-and-tracks
    title: Subtitles and tracks
    status: guide
    guide: docs/areas/subtitles-and-tracks.md
    summary: "Choosing, styling and timing audio and subtitle streams in the player, on both engines."
    keywords: [subtitle, subtitles, captions, track, tracks, audio track, language, subtitle delay, subtitle sync, subtitle style, pgs, vobsub, ass, srt, forced, sdh, ondertitel, ondertiteling, ondertitels, spoor, sporen, audiospoor, taal, vertraging, verspringen, springen, jump, out of sync]
    paths:
      - player/local/src/main/java/dev/jdtech/jellyfin/player/local/presentation/PlayerViewModel.kt
      - player/local/src/main/java/dev/jdtech/jellyfin/player/local/domain/SeriesTrackPreference.kt
      - player/local/src/main/java/dev/jdtech/jellyfin/player/local/domain/TrackPicks.kt
      - player/local/src/main/java/dev/jdtech/jellyfin/player/local/domain/SubtitleFiles.kt
      - player/local/src/main/java/dev/jdtech/jellyfin/player/local/domain/StreamSwitches.kt
      - player/local/src/main/java/dev/jdtech/jellyfin/player/local/domain/PlaylistManager.kt
      - player/local/src/main/java/dev/jdtech/jellyfin/player/local/domain/Extensions.kt
      - player/local/src/main/java/dev/jdtech/jellyfin/player/local/domain/AutoSyncSubtitleCueParser.kt
      - player/local/src/main/java/dev/jdtech/jellyfin/player/local/engine/EngineDefaults.kt
      - player/local/src/main/java/dev/jdtech/jellyfin/player/local/engine/exo/
      - player/local/src/main/java/dev/jdtech/jellyfin/player/local/engine/mpv/MpvSubtitleFiles.kt
      - player/local/src/main/java/dev/jdtech/jellyfin/player/local/engine/mpv/MpvSubtitleOptions.kt
      - player/core/src/main/java/dev/jdtech/jellyfin/player/core/domain/models/
      - server/jellyfin/src/main/java/dev/jdtech/jellyfin/server/jellyfin/JellyfinDeviceProfiles.kt
      - server/jellyfin/src/main/java/dev/jdtech/jellyfin/server/jellyfin/JellyfinPlayback.kt
      - domain/src/main/kotlin/dev/jdtech/jellyfin/models/SeriesTrackPreference.kt
      - data/src/main/java/dev/jdtech/jellyfin/models/SeriesTrackPreferenceDto.kt
      - settings/src/main/java/dev/jdtech/jellyfin/settings/domain/AppPreferences.kt
      - settings/src/main/java/dev/jdtech/jellyfin/settings/presentation/subtitle/
      - core/src/main/java/dev/jdtech/jellyfin/utils/SubtitleStyle.kt
      - app/phone/src/main/java/dev/jdtech/jellyfin/presentation/player/
      - app/phone/src/main/java/dev/jdtech/jellyfin/presentation/settings/SubtitleStyleScreen.kt
      - app/tv/src/main/java/dev/jdtech/jellyfin/ce/presentation/player/
    ports:
      - MediaRepository (getSeriesTrackPreferences, saveSeriesTrackPreference)
      - PlaybackPort (audioStreamIndex)
      - EnginePlayer (setSubtitleDelayMs)
    docs:
      - docs/track-test-series.md
      - docs/mpv-checklist.md
      - docs/dev-environment.md
      - docs/audit/checklist.md
      - docs/tv-research/adr/0004-tv-player-ui.md
    checklist:
      - docs/mpv-checklist.md on both backends
      - docs/track-test-series.md step lists for the series choice and the ASS override
      - python3 .claude/skills/translate-strings/scripts/check-translations.py when strings change
    test_data:
      - "Tracks Movie: 2 audio, 2 embedded subtitles (one forced), external .de.srt"
      - "Image Subs Movie: PGS and VobSub; a 1.5 Mbps cap transcodes it"
      - "Tracks Show: 2 audio (dut-tagged Dutch); a 1.5 Mbps cap transcodes it"
      - "Und Audio Show: audio tagged und"
      - "Track Test, Other Show, Subtitle Style Test: scripts/make-track-test-series.sh, added by hand"
    rules:
      - R6 engine packages stay behind EnginePlayer
      - R1-R3 no SDK outside server/jellyfin; device profile changes go there
      - R4 series choice through MediaRepository, not ServerDatabaseDao
      - R10 value-class ids
      - R12 ticks through Ticks
    tests:
      - ./gradlew :player:local:testDebugUnitTest --tests '*Subtitle*' --tests '*Track*' --tests '*StreamSwitches*' --tests '*AudioChoice*' --tests '*SwitchFailureText*' --tests '*PlayerInvariantsTest'
      - ./gradlew :data:testDebugUnitTest --tests '*SeriesTrackPreferenceTest'
      - ./gradlew :server:jellyfin:testDebugUnitTest --tests '*JellyfinDeviceProfilesTest' --tests '*PlaybackSourceMappingTest'
      - ./gradlew :core:testLibreDebugUnitTest --tests '*SubtitleStyleTest'
    pitfalls:
      - A transcode drops the tracks inside the file; load the server's extracted files, only for transcodes (#597, #613)
      - The first subtitle request of a transcode waits for all extraction; never hold up the video (#711)
      - media3 draws nothing from a whole image subtitle file; ImageSubtitleFileParser splits it (#613)
      - Language codes differ per engine and server (en, eng, dut, nld); use normalizeLanguage (#580)
      - mpv draws subtitles itself; style goes through MpvSubtitleOptions (#308)
      - Toggling sub-ass-override while mpv plays loses a cue unless the track is reselected (#833)
      - A positive delay lost cues after a forward seek and delayed the item end (#650, #619)
      - On a LOCAL source every subtitle row is a sidecar file, whatever isExternal says
      - Shared code reads media3 Tracks on both engines; player/core Track is the Cast model
    decisions:
      - "#19 image subtitles without a transcode"
      - "#24 subtitle style settings"
      - "#115, #120 choice per series; audio never remembered as off"
      - "#300, #308 override embedded styles, also on mpv"
      - "#451 one track name on both backends"
      - "#580, #834 series choice and preferred language sent for a transcode"
      - "#596, #726 audio switch during a transcode; latest switch wins"
      - "#597, #613 embedded and image subtitles during a transcode"
      - "#612 mpv capped profile never burns in a subtitle"
      - "#617, #711 subtitle files off the main thread, only when wanted"
      - "#619, #650 subtitle delay and sync"
      - "#750 series choice through the repository"
      - "TV ADR 0004: TV dialogs call switchToTrack()"
